<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DCAR ATELIER — Suivi Véhicule</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0c10; --surface:#12151c; --surface2:#1a1e28; --border:#252a38;
  --accent:#3b82f6; --accent2:#06b6d4; --gold:#f59e0b; --text:#f0f2f7;
  --muted:#6b7280; --success:#10b981; --warning:#f59e0b; --danger:#ef4444;
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

/* NAV */
nav{display:flex;align-items:center;justify-content:space-between;padding:18px 32px;border-bottom:1px solid var(--border);background:rgba(10,12,16,0.97);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100;}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:20px;letter-spacing:-0.5px;}
.logo .d{color:#3b82f6;} .logo .car{color:#06b6d4;} .logo .atelier{color:var(--gold);font-size:13px;font-weight:600;letter-spacing:2px;display:block;margin-top:-4px;}
.nav-tabs{display:flex;gap:4px;background:var(--surface);border-radius:10px;padding:4px;}
.nav-tab{padding:8px 20px;border-radius:8px;border:none;background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:all .2s;}
.nav-tab.active{background:var(--accent);color:white;}
.nav-tab:hover:not(.active){color:var(--text);}

/* VIEWS */
.view{display:none;} .view.active{display:block;}

/* ══ CLIENT VIEW ══ */
.client-hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;position:relative;overflow:hidden;}
.client-hero::before{content:'';position:absolute;top:-200px;left:50%;transform:translateX(-50%);width:600px;height:600px;background:radial-gradient(circle,rgba(59,130,246,0.10) 0%,transparent 70%);pointer-events:none;}
.client-title{font-family:'Syne',sans-serif;font-size:clamp(30px,5vw,52px);font-weight:800;text-align:center;line-height:1.1;margin-bottom:10px;letter-spacing:-1px;}
.client-title span{background:linear-gradient(135deg,#3b82f6,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.client-sub{color:var(--muted);font-size:16px;text-align:center;margin-bottom:40px;font-weight:300;}
.search-box{width:100%;max-width:500px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;position:relative;z-index:1;}
.search-label{font-size:11px;font-weight:600;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-bottom:8px;}
.plate-input-wrap{display:flex;gap:10px;align-items:center;}
.plate-icon{width:44px;height:44px;flex-shrink:0;background:var(--surface2);border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;}
.plate-input{flex:1;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:12px 16px;color:var(--text);font-family:'Syne',sans-serif;font-size:18px;font-weight:700;letter-spacing:3px;text-transform:uppercase;outline:none;transition:border-color .2s;}
.plate-input::placeholder{color:var(--muted);letter-spacing:2px;font-size:15px;}
.plate-input:focus{border-color:var(--accent);}
.search-btn{width:100%;margin-top:14px;background:linear-gradient(135deg,#3b82f6,#2563eb);border:none;border-radius:10px;padding:14px;color:white;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .2s,transform .1s;}
.search-btn:hover{opacity:0.9;transform:translateY(-1px);}

/* RESULT */
.result-card{width:100%;max-width:680px;margin:28px auto 0;background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden;animation:slideUp .4s ease;}
@keyframes slideUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}

/* STATUS HERO - gros bloc statut en haut */
.status-hero{padding:28px 28px 24px;background:var(--surface2);border-bottom:1px solid var(--border);}
.status-hero-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px;}
.vehicle-info{display:flex;align-items:center;gap:14px;}
.plate-badge{background:#1e3a8a;border:2px solid #3b82f6;border-radius:8px;padding:6px 14px;font-family:'Syne',sans-serif;font-size:16px;font-weight:800;letter-spacing:2px;color:white;}
.vh-name{font-size:15px;font-weight:500;}
.vh-model{font-size:12px;color:var(--muted);}

/* Grande carte statut actuel */
.current-status-card{border-radius:14px;padding:20px 22px;display:flex;align-items:center;gap:18px;}
.cs-emoji{font-size:36px;flex-shrink:0;}
.cs-label{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;margin-bottom:4px;}
.cs-desc{font-size:13px;opacity:0.75;font-weight:300;}
.cs-badge{margin-left:auto;padding:6px 14px;border-radius:100px;font-size:12px;font-weight:600;white-space:nowrap;}

/* PROGRESS BAR */
.progress-section{padding:24px 28px;}
.progress-label{font-size:11px;font-weight:600;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-bottom:16px;}
.progress-track{display:flex;align-items:center;gap:0;margin-bottom:20px;}
.prog-step{display:flex;flex-direction:column;align-items:center;flex:1;position:relative;}
.prog-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;border:2px solid transparent;z-index:1;background:var(--bg);transition:all .3s;}
.prog-dot.done{background:rgba(16,185,129,0.2);border-color:var(--success);color:var(--success);}
.prog-dot.active{background:rgba(59,130,246,0.2);border-color:var(--accent);color:var(--accent);box-shadow:0 0 14px rgba(59,130,246,0.5);animation:pulse 2s infinite;}
.prog-dot.pending{background:var(--surface2);border-color:var(--border);color:var(--muted);}
@keyframes pulse{0%,100%{box-shadow:0 0 10px rgba(59,130,246,0.4);}50%{box-shadow:0 0 22px rgba(59,130,246,0.7);}}
.prog-connector{flex:1;height:2px;margin-top:-14px;transition:background .3s;}
.prog-connector.done{background:var(--success);}
.prog-connector.active{background:linear-gradient(to right,var(--accent),var(--border));}
.prog-connector.pending{background:var(--border);}
.prog-name{font-size:10px;color:var(--muted);text-align:center;margin-top:6px;max-width:60px;line-height:1.3;}
.prog-name.active{color:var(--accent);}
.prog-name.done{color:var(--success);}

/* STEPS DETAIL */
.steps-detail{display:flex;flex-direction:column;gap:0;}
.step{display:flex;align-items:flex-start;gap:14px;padding-bottom:20px;position:relative;}
.step:last-child{padding-bottom:0;}
.step-left{display:flex;flex-direction:column;align-items:center;flex-shrink:0;}
.step-dot{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;border:2px solid transparent;transition:all .3s;}
.step-dot.done{background:rgba(16,185,129,0.15);border-color:var(--success);}
.step-dot.active{background:rgba(59,130,246,0.2);border-color:var(--accent);animation:pulse 2s infinite;}
.step-dot.pending{background:var(--surface2);border-color:var(--border);}
.step-line{width:2px;flex:1;min-height:20px;background:var(--border);margin-top:4px;transition:background .3s;}
.step-line.done{background:var(--success);}
.step-line.active{background:linear-gradient(to bottom,var(--accent),var(--border));}
.step:last-child .step-line{display:none;}
.step-content{padding-top:6px;flex:1;}
.step-name{font-size:14px;font-weight:500;margin-bottom:2px;}
.step-name.done{color:var(--success);}
.step-name.active{color:var(--accent);}
.step-name.pending{color:var(--muted);}
.step-desc{font-size:12px;color:var(--muted);font-weight:300;}
.step-tag{display:inline-block;margin-top:4px;padding:2px 10px;border-radius:100px;font-size:11px;font-weight:600;}

/* NOT FOUND */
.not-found{text-align:center;padding:40px 20px;color:var(--muted);max-width:500px;margin:28px auto 0;background:var(--surface);border:1px solid var(--border);border-radius:20px;}
.not-found .nf-icon{font-size:48px;margin-bottom:12px;}

/* ══ ADMIN VIEW ══ */
.admin-wrap{padding:24px 32px;max-width:1500px;margin:0 auto;}
.admin-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px;}
.admin-title{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;}
.add-btn{background:linear-gradient(135deg,#3b82f6,#2563eb);border:none;border-radius:10px;padding:12px 20px;color:white;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;transition:opacity .2s;}
.add-btn:hover{opacity:0.85;}

/* KANBAN */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:16px;}
.kanban::-webkit-scrollbar{height:6px;}
.kanban::-webkit-scrollbar-track{background:var(--surface);}
.kanban::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.admin-search{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.admin-search-input{flex:1;min-width:180px;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:11px 16px;color:var(--text);font-family:'Syne',sans-serif;font-size:16px;font-weight:700;letter-spacing:2px;text-transform:uppercase;outline:none;transition:border-color .2s;}
.admin-search-input::placeholder{color:var(--muted);font-size:13px;letter-spacing:1px;font-weight:400;}
.admin-search-input:focus{border-color:var(--accent);}
.admin-search-btn{background:linear-gradient(135deg,#3b82f6,#2563eb);border:none;border-radius:10px;padding:11px 20px;color:white;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;}
.search-result-admin{background:var(--surface2);border:1px solid var(--accent);border-radius:12px;padding:16px 20px;margin-bottom:20px;display:none;animation:slideUp .3s ease;}
.sra-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
.sra-info{display:flex;align-items:center;gap:12px;}
.sra-plate{background:#1e3a8a;border:2px solid #3b82f6;border-radius:8px;padding:5px 12px;font-family:'Syne',sans-serif;font-size:15px;font-weight:800;letter-spacing:2px;color:white;}
.sra-name{font-size:14px;font-weight:500;}
.sra-client{font-size:12px;color:var(--muted);}
.sra-status{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.sra-current{padding:6px 14px;border-radius:100px;font-size:12px;font-weight:600;}
.sra-actions{display:flex;gap:8px;flex-wrap:wrap;}
.sra-btn{padding:9px 16px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;}
.sra-btn:hover{border-color:var(--accent);color:var(--accent);}
.sra-btn.mail:hover{border-color:#f59e0b;color:#f59e0b;}
.sra-btn.danger:hover{border-color:var(--danger);color:var(--danger);}
.column{flex-shrink:0;width:200px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.col-header{padding:11px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.col-name{font-size:11px;font-weight:600;letter-spacing:0.3px;}
.col-count{background:var(--surface2);border-radius:100px;padding:2px 7px;font-size:11px;color:var(--muted);font-weight:600;}
.col-dot{width:7px;height:7px;border-radius:50%;margin-right:6px;display:inline-block;}
.cards-list{padding:8px;display:flex;flex-direction:column;gap:7px;min-height:60px;}
.vcard{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:11px;cursor:pointer;transition:border-color .2s,transform .15s;}
.vcard:hover{border-color:var(--accent);transform:translateY(-1px);}
.vcard-plate{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;letter-spacing:1.5px;color:var(--accent);margin-bottom:3px;}
.vcard-model{font-size:12px;color:var(--text);margin-bottom:2px;}
.vcard-client{font-size:11px;color:var(--muted);margin-bottom:8px;}
.vcard-actions{display:flex;gap:4px;}
.vcard-btn{flex:1;padding:5px 0;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:10px;font-weight:500;cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif;}
.vcard-btn:hover{border-color:var(--accent);color:var(--accent);}
.vcard-btn.mail:hover{border-color:#f59e0b;color:#f59e0b;}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.80);z-index:200;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:20px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;animation:slideUp .3s ease;}
.modal-header{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;}
.modal-close{width:32px;height:32px;border-radius:8px;background:var(--surface2);border:none;color:var(--muted);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.modal-body{padding:20px 24px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-group{margin-bottom:14px;}
.form-label{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:0.5px;text-transform:uppercase;margin-bottom:5px;display:block;}
.form-input,.form-select{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:11px 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:border-color .2s;}
.form-input:focus,.form-select:focus{border-color:var(--accent);}
.form-select option{background:var(--surface2);}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;}
.btn-primary{flex:1;background:linear-gradient(135deg,#3b82f6,#2563eb);border:none;border-radius:10px;padding:12px;color:white;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;}
.btn-secondary{padding:12px 20px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer;}

/* NOTIFICATION MODAL */
.notif-tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--surface2);border-radius:10px;padding:4px;}
.ntab{flex:1;padding:8px;border-radius:8px;border:none;background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;}
.ntab.active{background:var(--accent);color:white;}
.notif-panel{display:none;} .notif-panel.active{display:block;}
.msg-box{background:#0d1f12;border:1px solid #25d36633;border-radius:12px;padding:16px;font-size:13px;line-height:1.75;color:#e8f5e9;white-space:pre-wrap;font-family:'DM Sans',sans-serif;margin-bottom:12px;max-height:220px;overflow-y:auto;}
.email-box{background:#1a150a;border:1px solid #f59e0b33;border-radius:12px;padding:16px;font-size:13px;line-height:1.75;color:#fef3c7;white-space:pre-wrap;font-family:'DM Sans',sans-serif;margin-bottom:12px;max-height:220px;overflow-y:auto;}
.action-btn{width:100%;padding:12px;border-radius:10px;border:none;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px;}
.btn-mail{background:linear-gradient(135deg,#f59e0b,#d97706);color:white;}
.btn-copy{background:var(--surface2);border:1px solid var(--border);color:var(--text);}
.info-banner{background:rgba(59,130,246,0.1);border:1px solid rgba(59,130,246,0.25);border-radius:10px;padding:12px 14px;font-size:12px;color:#93c5fd;margin-bottom:14px;line-height:1.6;}

/* Status colors */
.s0{color:#6b7280;} .s0b{background:rgba(107,114,128,0.15);}
.s1{color:#f59e0b;} .s1b{background:rgba(245,158,11,0.15);}
.s2{color:#3b82f6;} .s2b{background:rgba(59,130,246,0.15);}
.s3{color:#8b5cf6;} .s3b{background:rgba(139,92,246,0.15);}
.s4{color:#06b6d4;} .s4b{background:rgba(6,182,212,0.15);}
.s5{color:#10b981;} .s5b{background:rgba(16,185,129,0.15);}
.s6{color:#f97316;} .s6b{background:rgba(249,115,22,0.15);}
.dot0{background:#6b7280;} .dot1{background:#f59e0b;} .dot2{background:#3b82f6;}
.dot3{background:#8b5cf6;} .dot4{background:#06b6d4;} .dot5{background:#10b981;} .dot6{background:#f97316;}

@media(max-width:600px){
  nav{padding:14px 16px;}
  .admin-wrap{padding:16px;}
  .client-hero{padding:28px 16px;}
  .kanban{gap:8px;}
  .column{width:180px;}
  .form-row{grid-template-columns:1fr;}
  .progress-track{display:none;}
}
</style>
</head>
<body>

<nav>
  <div class="logo">
    <span><span class="d">D</span><span class="car">CAR</span></span>
    <span class="atelier">ATELIER</span>
  </div>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="switchView('client',this)">🔍 Suivi véhicule</button>
    <button class="nav-tab" onclick="switchView('admin',this)">⚙️ Admin</button>
  </div>
</nav>

<!-- ══════════ CLIENT VIEW ══════════ -->
<div id="view-client" class="view active">
  <div class="client-hero">
    <div class="client-title">Où est<br><span>votre véhicule ?</span></div>
    <p class="client-sub">Entrez votre plaque pour suivre l'avancement en temps réel</p>
    <div class="search-box">
      <div class="search-label">Numéro d'immatriculation</div>
      <div class="plate-input-wrap">
        <div class="plate-icon">🚗</div>
        <input class="plate-input" id="plateSearch" type="text" placeholder="AB-123-CD" maxlength="9"
          oninput="this.value=this.value.toUpperCase()"
          onkeydown="if(event.key==='Enter')searchVehicle()">
      </div>
      <button class="search-btn" onclick="searchVehicle()">Rechercher mon véhicule →</button>
    </div>
    <div id="searchResult" style="width:100%;max-width:680px;"></div>
  </div>
</div>

<!-- ══════════ ADMIN VIEW ══════════ -->
<div id="view-admin" class="view">
  <div class="admin-wrap">
    <div class="admin-header">
      <div class="admin-title">📋 Tableau de bord</div>
      <button class="add-btn" onclick="openAddModal()">＋ Nouveau véhicule</button>
    </div>
    <div class="admin-search">
      <span style="font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;">Rechercher un véhicule</span>
      <input class="admin-search-input" id="adminSearchInput" type="text" placeholder="Tapez la plaque ex: AB-123-CD" maxlength="9"
        oninput="this.value=this.value.toUpperCase()"
        onkeydown="if(event.key==='Enter')adminSearch()">
      <button class="admin-search-btn" onclick="adminSearch()">Rechercher</button>
      <button class="admin-search-btn" style="background:var(--surface2);border:1px solid var(--border);color:var(--muted);" onclick="clearAdminSearch()">✕ Effacer</button>
    </div>
    <div class="search-result-admin" id="searchResultAdmin"></div>
    <div class="kanban" id="kanban"></div>
  </div>
</div>

<!-- ══════════ MODAL : AJOUTER ══════════ -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">➕ Nouveau véhicule</div>
      <button class="modal-close" onclick="closeModal('addModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Plaque</label>
          <input class="form-input" id="f-plate" placeholder="AB-123-CD" style="text-transform:uppercase;font-family:'Syne',sans-serif;letter-spacing:2px;font-weight:700;">
        </div>
        <div class="form-group">
          <label class="form-label">Marque & Modèle</label>
          <input class="form-input" id="f-model" placeholder="ex: Renault Clio">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Nom du client</label>
        <input class="form-input" id="f-client" placeholder="ex: Jean Dupont">
      </div>
      <div class="form-group">
        <label class="form-label">📧 Email du client</label>
        <input class="form-input" id="f-email" placeholder="client@email.com" type="email">
      </div>
      <div class="form-group">
        <label class="form-label">Statut initial</label>
        <select class="form-select" id="f-status">
          <option value="0">⏳ Attente de pièce</option>
          <option value="1">🔧 Attente atelier</option>
          <option value="2">🛠️ En réparation</option>
          <option value="3">🎨 En cabine de peinture</option>
          <option value="4">🚿 Attente lavage</option>
          <option value="5">✅ Vérification</option>
          <option value="6">📅 Restitution programmée</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal('addModal')">Annuler</button>
      <button class="btn-primary" onclick="addVehicle()">Ajouter & envoyer notification</button>
    </div>
  </div>
</div>

<!-- ══════════ MODAL : STATUT ══════════ -->
<div class="modal-overlay" id="statusModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="statusModalTitle">Changer le statut</div>
      <button class="modal-close" onclick="closeModal('statusModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Nouveau statut</label>
        <select class="form-select" id="s-status">
          <option value="0">⏳ Attente de pièce</option>
          <option value="1">🔧 Attente atelier</option>
          <option value="2">🛠️ En réparation</option>
          <option value="3">🎨 En cabine de peinture</option>
          <option value="4">🚿 Attente lavage</option>
          <option value="5">✅ Vérification</option>
          <option value="6">📅 Restitution programmée</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal('statusModal')">Annuler</button>
      <button class="btn-primary" onclick="applyStatus()">Mettre à jour & notifier</button>
    </div>
  </div>
</div>

<!-- ══════════ MODAL : NOTIFICATIONS ══════════ -->
<div class="modal-overlay" id="notifModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="notifTitle">📨 Notifications client</div>
      <button class="modal-close" onclick="closeModal('notifModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="info-banner" id="notifBanner"></div>
      <!-- Email panel -->
      <div class="notif-panel active" id="panel-email">
        <div style="margin-bottom:12px;">
          <div class="form-label" style="margin-bottom:5px;">Objet</div>
          <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--gold);font-weight:500;" id="emailSubject"></div>
        </div>
        <div class="form-label" style="margin-bottom:8px;">Aperçu de l'email</div>
        <div id="emailPreview" style="border-radius:12px;overflow:hidden;border:1px solid var(--border);margin-bottom:12px;max-height:340px;overflow-y:auto;"></div>
        <button class="action-btn btn-mail" onclick="openMail()" style="margin-bottom:8px;">📧 Envoyer l'email</button>
      </div>
    </div>
  </div>
</div>

<script>

const STATUSES = [
  { label:'Attente de pièce',    emoji:'⏳', desc:'Les pièces nécessaires sont en commande.',            cls:'s0', dot:'dot0', short:'Att. pièce' },
  { label:'Attente atelier',     emoji:'🔧', desc:'Votre véhicule attend son tour en atelier.',          cls:'s1', dot:'dot1', short:'Att. atelier' },
  { label:'En réparation',       emoji:'🛠️', desc:'Réparation carrosserie en cours.',                   cls:'s2', dot:'dot2', short:'Réparation' },
  { label:'En cabine peinture',  emoji:'🎨', desc:'Application et séchage de la peinture.',             cls:'s3', dot:'dot3', short:'Peinture' },
  { label:'Attente lavage',      emoji:'🚿', desc:'Finitions et nettoyage du véhicule.',                cls:'s4', dot:'dot4', short:'Lavage' },
  { label:'Vérification',        emoji:'✅', desc:'Contrôle qualité final avant restitution.',          cls:'s5', dot:'dot5', short:'Vérif.' },
  { label:'Restitution prog.',   emoji:'📅', desc:'Votre véhicule est prêt, restitution planifiée.',    cls:'s6', dot:'dot6', short:'Restitution' },
];

let vehicles = [
  { id:1, plate:'AB-123-CD', model:'Renault Clio IV',  client:'Jean Dupont',     phone:'0612345678', email:'jean@exemple.fr',   status:2, addedAt:'13/01/2025 09:00' },
  { id:2, plate:'EF-456-GH', model:'Peugeot 308 SW',   client:'Marie Martin',    phone:'0698765432', email:'marie@exemple.fr',  status:4, addedAt:'15/01/2025 11:00' },
  { id:3, plate:'IJ-789-KL', model:'Citroën C3',       client:'Paul Bernard',    phone:'0623456789', email:'paul@exemple.fr',   status:6, addedAt:'10/01/2025 10:00' },
  { id:4, plate:'MN-012-OP', model:'VW Golf VII',      client:'Sophie Lefebvre', phone:'0634567890', email:'sophie@exemple.fr', status:0, addedAt:'20/01/2025 14:00' },
  { id:5, plate:'QR-345-ST', model:'BMW Série 3',      client:'Lucas Moreau',    phone:'0645678901', email:'lucas@exemple.fr',  status:1, addedAt:'17/01/2025 12:00' },
];
let nextId = 6;
let editingId = null;
let currentNotifVehicleId = null;
const PORTAL_URL = 'https://younes-cloudiiii.github.io/DCAR-ATELIER';

// ── VIEW SWITCH ──────────────────────────────────────────────────────────────
function switchView(v, btn) {
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(el=>el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  btn.classList.add('active');
  if(v==='admin') renderKanban();
}

// ── CLIENT SEARCH ─────────────────────────────────────────────────────────────
function searchVehicle() {
  const q = document.getElementById('plateSearch').value.trim().toUpperCase().replace(/[\s-]/g,'');
  const el = document.getElementById('searchResult');
  if(!q){el.innerHTML='';return;}
  const v = vehicles.find(x=>x.plate.replace(/-/g,'')===q);
  if(!v){
    el.innerHTML=`<div class="not-found"><div class="nf-icon">🔍</div><p>Aucun véhicule trouvé pour <strong>${q}</strong>.<br>Vérifiez votre plaque ou contactez-nous.</p></div>`;
    return;
  }
  const s = STATUSES[v.status];

  // Progress bar
  const progItems = STATUSES.map((st,i)=>{
    const state = i<v.status?'done':i===v.status?'active':'pending';
    const connector = i<STATUSES.length-1 ? `<div class="prog-connector ${i<v.status?'done':i===v.status?'active':'pending'}"></div>` : '';
    return `<div class="prog-step">
      <div class="prog-dot ${state}">${state==='done'?'✓':st.emoji}</div>
      <div class="prog-name ${state}">${st.short}</div>
    </div>${connector}`;
  }).join('');

  // Steps detail
  const steps = STATUSES.map((st,i)=>{
    const state = i<v.status?'done':i===v.status?'active':'pending';
    let tag='';
    if(state==='done') tag=`<span class="step-tag s5b s5" style="font-size:10px;">✓ Terminé</span>`;
    if(state==='active') tag=`<span class="step-tag s2b s2" style="font-size:10px;">▶ En cours</span>`;
    return `<div class="step">
      <div class="step-left">
        <div class="step-dot ${state}">${state==='done'?'✓':st.emoji}</div>
        <div class="step-line ${state}"></div>
      </div>
      <div class="step-content">
        <div class="step-name ${state}">${st.label}</div>
        <div class="step-desc">${st.desc}</div>
        ${tag}
      </div>
    </div>`;
  }).join('');

  el.innerHTML=`
  <div class="result-card">
    <div class="status-hero">
      <div class="status-hero-top">
        <div class="vehicle-info">
          <div class="plate-badge">${v.plate}</div>
          <div>
            <div class="vh-name">${v.model}</div>
            <div class="vh-model">Prise en charge le ${v.addedAt}</div>
          </div>
        </div>
      </div>
      <div class="current-status-card ${s.cls}b" style="border:1px solid;border-color:currentColor;border-color:var(--border);">
        <div class="cs-emoji">${s.emoji}</div>
        <div>
          <div class="cs-label ${s.cls}">${s.label}</div>
          <div class="cs-desc">${s.desc}</div>
        </div>
        <div class="cs-badge ${s.cls}b ${s.cls}" style="border:1px solid currentColor;">Étape ${v.status+1}/7</div>
      </div>
    </div>
    <div class="progress-section">
      <div class="progress-label">Progression globale</div>
      <div class="progress-track">${progItems}</div>
      <div class="progress-label" style="margin-top:20px;">Détail des étapes</div>
      <div class="steps-detail">${steps}</div>
    </div>
  </div>`;
}

// ── KANBAN ───────────────────────────────────────────────────────────────────
function adminSearch() {
  const q = document.getElementById('adminSearchInput').value.trim().toUpperCase().replace(/[\s-]/g,'');
  const el = document.getElementById('searchResultAdmin');
  if(!q){el.style.display='none';el.innerHTML='';return;}
  const v = vehicles.find(x=>x.plate.replace(/-/g,'')===q);
  if(!v){
    el.style.display='block';
    el.innerHTML=`<div style="text-align:center;color:var(--muted);padding:10px;">Aucun vehicule trouve pour <strong style="color:var(--text)">${q}</strong></div>`;
    return;
  }
  const s = STATUSES[v.status];
  el.style.display='block';
  el.innerHTML=`
    <div class="sra-top">
      <div class="sra-info">
        <div class="sra-plate">${v.plate}</div>
        <div>
          <div class="sra-name">${v.model}</div>
          <div class="sra-client">👤 ${v.client} &nbsp;|&nbsp; 📱 ${v.phone||'—'} &nbsp;|&nbsp; 📧 ${v.email||'—'}</div>
          <div class="sra-client" style="margin-top:2px;">Prise en charge : ${v.addedAt}</div>
        </div>
      </div>
      <div class="sra-current ${s.cls} ${s.cls}b">${s.emoji} ${s.label}</div>
    </div>
    <div class="sra-actions">
      <button class="sra-btn" onclick="openStatusModal(${v.id});"><strong>Changer le statut</strong></button>
      <button class="sra-btn mail" onclick="openNotifModal(${v.id})">📧 Envoyer email</button>
      <button class="sra-btn danger" onclick="deleteVehicle(${v.id})">Supprimer</button>
    </div>`;
}

function clearAdminSearch() {
  document.getElementById('adminSearchInput').value='';
  const el = document.getElementById('searchResultAdmin');
  el.style.display='none';
  el.innerHTML='';
}

function deleteVehicle(id) {
  if(!confirm('Supprimer ce vehicule du tableau de bord ?')) return;
  vehicles = vehicles.filter(x=>x.id!==id);
  clearAdminSearch();
  renderKanban();
}

function renderKanban() {
  const kb = document.getElementById('kanban');
  kb.innerHTML = STATUSES.map((s,si)=>{
    const cars = vehicles.filter(v=>v.status===si);
    const cards = cars.map(v=>`
      <div class="vcard">
        <div class="vcard-plate">${v.plate}</div>
        <div class="vcard-model">${v.model}</div>
        <div class="vcard-client">👤 ${v.client}</div>
        <div class="vcard-actions">
          <button class="vcard-btn" onclick="openStatusModal(${v.id})">Statut</button>
          <button class="vcard-btn mail" onclick="openNotifModal(${v.id})">📧 Email</button>
        </div>
      </div>`).join('');
    return `<div class="column">
      <div class="col-header">
        <span><span class="col-dot ${s.dot}"></span><span class="col-name ${s.cls}">${s.emoji} ${s.label}</span></span>
        <span class="col-count">${cars.length}</span>
      </div>
      <div class="cards-list">${cards||'<div style="padding:8px;font-size:11px;color:var(--muted);text-align:center;">Vide</div>'}</div>
    </div>`;
  }).join('');
}

// ── ADD VEHICLE ───────────────────────────────────────────────────────────────
function openAddModal() {
  ['f-plate','f-model','f-client','f-email'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-status').value='0';
  document.getElementById('addModal').classList.add('open');
}
function addVehicle() {
  const plate  = document.getElementById('f-plate').value.trim().toUpperCase();
  const model  = document.getElementById('f-model').value.trim();
  const client = document.getElementById('f-client').value.trim();
  const phone  = '';
  const email  = document.getElementById('f-email').value.trim();
  const status = parseInt(document.getElementById('f-status').value);
  if(!plate||!model||!client){alert('Plaque, modèle et client sont obligatoires.');return;}
  const now = new Date();
  const addedAt = now.toLocaleDateString('fr-FR')+' '+now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  const v = {id:nextId++, plate, model, client, phone, email, status, addedAt};
  vehicles.push(v);
  closeModal('addModal');
  renderKanban();
  // Ouvrir directement les notifications
  openNotifModal(v.id, 'wa', true);
}

// ── STATUS CHANGE ─────────────────────────────────────────────────────────────
function openStatusModal(id) {
  editingId=id;
  const v=vehicles.find(x=>x.id===id);
  document.getElementById('statusModalTitle').textContent=`Statut — ${v.plate}`;
  document.getElementById('s-status').value=v.status;
  document.getElementById('statusModal').classList.add('open');
}
function applyStatus() {
  const v=vehicles.find(x=>x.id===editingId);
  v.status=parseInt(document.getElementById('s-status').value);
  closeModal('statusModal');
  renderKanban();
  openNotifModal(v.id, false);
}

// ── NOTIFICATIONS ─────────────────────────────────────────────────────────────


const EMAIL_SUBJECTS = [
  v=>`[DCAR ATELIER] Prise en charge confirmee - ${v.plate}`,
  v=>`[DCAR ATELIER] ${v.plate} - Passage en atelier imminent`,
  v=>`[DCAR ATELIER] ${v.plate} - Reparation en cours`,
  v=>`[DCAR ATELIER] ${v.plate} - Peinture en cours`,
  v=>`[DCAR ATELIER] ${v.plate} - Finitions et lavage`,
  v=>`[DCAR ATELIER] ${v.plate} - Controle qualite final`,
  v=>`[DCAR ATELIER] ${v.plate} - Votre vehicule est pret !`,
];

const EMAIL_BODIES = [
  `Votre vehicule a bien ete pris en charge. Les pieces necessaires sont en commande. Des leur reception, l'intervention demarrera. Nous vous informons a chaque etape de l'avancement.`,
  `Toutes les pieces de votre vehicule sont disponibles. Le passage en atelier est imminent. L'intervention demarrera tres prochainement.`,
  `La reparation de votre vehicule est en cours. Nos techniciens travaillent sur votre vehicule dans les delais prevus.`,
  `Votre vehicule est actuellement en cabine de peinture. L'application et le sechage sont en cours. C'est l'une des dernieres etapes avant la restitution.`,
  `Votre vehicule est a l'etape finitions et lavage. Nous finalisons les derniers details afin de vous restituer votre vehicule dans les meilleures conditions.`,
  `Votre vehicule est en cours de controle qualite final. Nous verifions chaque detail avant restitution. Vous serez contacte tres prochainement pour le rendez-vous.`,
  `Excellente nouvelle ! Votre vehicule est pret et vous attend. Nous allons vous contacter dans les plus brefs delais pour convenir du rendez-vous de restitution.`,
];

const STATUS_COLORS = ['#6b7280','#f59e0b','#3b82f6','#8b5cf6','#06b6d4','#10b981','#f97316'];

function buildEmailText(v) {
  const s = STATUSES[v.status];
  const body = EMAIL_BODIES[v.status];
  const progress = v.status + 1;
  const stepsText = STATUSES.map((st, i) => {
    const done = i < v.status;
    const active = i === v.status;
    const prefix = done ? '[OK]' : active ? '[>>]' : '[  ]';
    return prefix + ' ' + st.label;
  }).join('\n');
  return `Bonjour ${v.client.split(' ')[0]},\n\n` +
    `${body}\n\n` +
    `---\n` +
    `Vehicule : ${v.model}\n` +
    `Plaque   : ${v.plate}\n` +
    `Statut   : ${s.label} (etape ${progress}/7)\n` +
    `---\n\n` +
    `PROGRESSION :\n${stepsText}\n\n` +
    `Suivez l avancement en direct :\n${PORTAL_URL}\n` +
    `(saisissez votre plaque : ${v.plate})\n\n` +
    `Cordialement,\nDCAR ATELIER\nService a domicile`;
}

function openNotifModal(id, isNew=false) {
  currentNotifVehicleId = id;
  const v = vehicles.find(x=>x.id===id);
  const s = STATUSES[v.status];
  document.getElementById('notifTitle').textContent = `Email - ${v.plate}`;
  document.getElementById('notifBanner').innerHTML =
    `<strong>${v.client}</strong> &middot; ${v.model} &middot; <span class="${s.cls}">${s.emoji} ${s.label}</span>` +
    (isNew ? '<br>Vehicule ajoute - envoyez l email de bienvenue au client.' :
             '<br>Statut mis a jour - envoyez l email au client.');
  document.getElementById('emailSubject').textContent = EMAIL_SUBJECTS[v.status](v);
  const emailText = buildEmailText(v);
  document.getElementById('emailPreview').innerHTML = '<pre style="white-space:pre-wrap;font-family:DM Sans,sans-serif;font-size:13px;line-height:1.8;padding:16px;color:var(--text);background:var(--surface2);border-radius:10px;margin:0;">' + emailText + '</pre>';
  document.getElementById('notifModal').classList.add('open');
}

function openNotifModal(id, isNew=false) {
  currentNotifVehicleId = id;
  const v = vehicles.find(x=>x.id===id);
  const s = STATUSES[v.status];
  document.getElementById('notifTitle').textContent = `📨 Notifier — ${v.plate}`;
  document.getElementById('notifBanner').innerHTML =
    `<strong>${v.client}</strong> · ${v.model} · <span class="${s.cls}">${s.emoji} ${s.label}</span>`+
    (isNew ? '<br>✨ Véhicule ajouté — envoyez la notification de bienvenue au client.' :
             '<br>🔄 Statut mis à jour — informez le client de l\'avancement.');
  document.getElementById('emailSubject').textContent = EMAIL_SUBJECTS[v.status](v);
  document.getElementById('notifModal').classList.add('open');
}

function switchNotifTab(tab, btn) {
  document.querySelectorAll('.ntab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.notif-panel').forEach(p=>p.classList.remove('active'));
  if(btn) btn.classList.add('active');
  document.getElementById('panel-'+tab).classList.add('active');
}

async function openMail() {
  const v = vehicles.find(x=>x.id===currentNotifVehicleId);
  if(!v.email){alert('Aucun email renseigné pour ce client.');return;}
  const btn = document.querySelector('.action-btn.btn-mail');
  const orig = btn.innerHTML;
  btn.innerHTML = 'Envoi en cours...';
  btn.disabled = true;
  try {
    const prenom = v.client.split(' ')[0];
    const emailBody = `Bonjour ${prenom},\n\n${EMAIL_BODIES[v.status]}\n\nVehicule : ${v.model}\nPlaque : ${v.plate}\nStatut : ${STATUSES[v.status].label} (Etape ${v.status+1}/7)\n\nSuivez l'avancement :\n${PORTAL_URL}\n(plaque : ${v.plate})\n\nCordialement,\nDCAR ATELIER\nService a domicile`;
    const response = await fetch('https://dcar-atelier-1.onrender.com/send-email', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        to: v.email,
        subject: EMAIL_SUBJECTS[v.status](v),
        message: emailBody,
        from_name: 'DCAR ATELIER',
      })
    });
    const data = await response.json();
    if(data.success) {
      btn.innerHTML = '✅ Email envoyé !';
      btn.style.background = '#10b981';
      setTimeout(() => {
        btn.innerHTML = orig;
        btn.style.background = '';
        btn.disabled = false;
        closeModal('notifModal');
      }, 2000);
    } else {
      throw new Error(data.error);
    }
  } catch(err) {
    console.error('Render error:', err);
    btn.innerHTML = '❌ Erreur envoi';
    btn.style.background = '#ef4444';
    setTimeout(() => {
      btn.innerHTML = orig;
      btn.style.background = '';
      btn.disabled = false;
    }, 3000);
  }
}

function copyMsg(elId) {
  const txt = document.getElementById(elId).textContent;
  navigator.clipboard.writeText(txt).then(()=>{
    const btn = event.target;
    const orig = btn.innerHTML;
    btn.innerHTML='✅ Copié !';
    setTimeout(()=>btn.innerHTML=orig, 2000);
  });
}

// ── MODALS ────────────────────────────────────────────────────────────────────
function closeModal(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.modal-overlay').forEach(o=>{
  o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open');});
});

renderKanban();
</script>
</body>
</html>
